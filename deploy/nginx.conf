# Omit successful requests and polling; retain failed requests for diagnosis.
map $status $log_failed_request {
    default 0;
    ~^[45] 1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    access_log /dev/stdout combined if=$log_failed_request;
    # Request-body buffering is normal, not an application failure.
    error_log /dev/stderr error;

    charset utf-8;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    # Asset filenames are not content hashed. Revalidate after each deployment.
    add_header Cache-Control "no-store" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /_session {
        internal;
        proxy_pass http://cutout:8000/api/auth/me;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $http_host;
    }
    location = /login.html { try_files $uri =404; }
    location = /src/request-signal.js { default_type application/javascript; try_files $uri =404; }
    location = /src/login.js { default_type application/javascript; try_files $uri =404; }
    location = /styles.css { try_files $uri =404; }

    location = / {
        auth_request /_session;
        error_page 401 = /login.html;
        try_files /index.html =404;
    }
    location = /workflow.html {
        auth_request /_session;
        error_page 401 = /login.html;
        try_files $uri =404;
    }
    location = /index.html {
        auth_request /_session;
        error_page 401 = /login.html;
        try_files $uri =404;
    }
    # Asset requests must retain 401 so fetch can detect an expired session.
    location / {
        auth_request /_session;
        try_files $uri $uri/ =404;
    }

    # ES modules must be served as JavaScript, including legacy .mjs URLs.
    location ~ \.(?:mjs|js)$ {
        auth_request /_session;
        types { application/javascript js mjs; }
        default_type application/javascript;
        try_files $uri =404;
    }

    location /api/ {
        client_max_body_size 180m;
        proxy_pass http://cutout:8000;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ~ /\. {
        deny all;
    }
}
